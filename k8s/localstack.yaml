apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app: localstack
    app.kubernetes.io/part-of: instagram
spec:
  type: ClusterIP
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
    app.kubernetes.io/part-of: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
        app.kubernetes.io/part-of: instagram
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0
          ports:
            - name: edge
              containerPort: 4566
          env:
            - name: SERVICES
              value: s3
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:4566
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: BUCKET_NAME
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: REGION
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: localstack-init
            defaultMode: 0755
---
# Tự động tạo bucket S3 public-read mỗi khi LocalStack pod khởi động.
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  labels:
    app: localstack-init
    app.kubernetes.io/part-of: instagram
data:
  10-create-bucket.sh: |
    #!/bin/sh
    set -eu

    BUCKET="${BUCKET_NAME:-instagram-media}"
    AWS_REGION="${REGION:-ap-southeast-1}"

    awslocal s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1 || awslocal s3 mb "s3://$BUCKET" --region "$AWS_REGION"
    awslocal s3api put-bucket-policy --bucket "$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$BUCKET/*\"}]}"
