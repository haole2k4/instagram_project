x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-backend_instagram}
      MYSQL_USER: ${DB_USERNAME:-instagram_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-instagram_pass}
    ports:
      # Chỉ mở trên localhost; backend kết nối qua network nội bộ.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVICES: s3
      GATEWAY_LISTEN: 0.0.0.0:4566
      # Image community 4.14.0 không hỗ trợ snapshot persistence (endpoint state trả 404),
      # nên không mount volume: bucket được tạo lại mỗi lần khởi động bởi localstack-init.
    ports:
      # Trình duyệt cần truy cập S3 qua S3_PUBLIC_ENDPOINT nên vẫn bind ra ngoài.
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Redis chỉ dùng làm cache: không lưu xuống đĩa.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-instagram}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-instagram_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/instagram}
    ports:
      # Chỉ mở AMQP và management UI trên localhost; backend kết nối qua network nội bộ.
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend_instagram
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging: *default-logging
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-backend_instagram}
      DB_USERNAME: ${DB_USERNAME:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_pass}
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?Set JWT_BASE64_SECRET in the root .env file}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS:-1800}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-604800}
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      ACCESS_KEY: test
      SECRET_KEY: test
      REGION: ap-southeast-1
      BUCKET_NAME: instagram-media
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_POSTS: ${CACHE_TTL_POSTS:-60}
      CACHE_TTL_COMMENTS: ${CACHE_TTL_COMMENTS:-60}
      CACHE_TTL_USER_STATS: ${CACHE_TTL_USER_STATS:-120}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-instagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-instagram_pass}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/instagram}
      MQ_ENABLED: ${MQ_ENABLED:-true}
      MQ_NOTIFICATION_CONCURRENCY: ${MQ_NOTIFICATION_CONCURRENCY:-2}
      MQ_NOTIFICATION_MAX_ATTEMPTS: ${MQ_NOTIFICATION_MAX_ATTEMPTS:-4}
      MQ_NOTIFICATION_RETRY_INITIAL_MS: ${MQ_NOTIFICATION_RETRY_INITIAL_MS:-1000}
      MQ_NOTIFICATION_RETRY_MULTIPLIER: ${MQ_NOTIFICATION_RETRY_MULTIPLIER:-2}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  seed:
    image: mysql:8.4
    profiles: ["seed"]
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_NAME:-backend_instagram}
      MYSQL_USER: ${DB_USERNAME:-instagram_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-instagram_pass}
      MYSQL_PWD: ${DB_PASSWORD:-instagram_pass}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mysql --default-character-set=utf8mb4 --protocol=tcp -h mysql -u"${DB_USERNAME:-instagram_user}" "${DB_NAME:-backend_instagram}" < /seed-demo.sql'
    volumes:
      - ./backend_instagram/seed-demo.sql:/seed-demo.sql:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./Social-app-fontend
      args:
        REACT_APP_API_URL: http://localhost:8081
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  rabbitmq_data:
