# Test configuration with Testcontainers MySQL
# This will be overridden by Testcontainers at runtime
spring.datasource.url=jdbc:tc:mysql:8.0:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT config for tests
tenit.jwt.base64-secret=dGVzdC1vbmx5LWp3dC1rZXktMzItYnl0ZXMtZXhhY3RseSE=
tenit.jwt.token-validity-in-seconds=3600
tenit.jwt.refresh-token-validity-in-seconds=7200

# Disable websocket for tests
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=65536

# Disable external services
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# S3 client chỉ được khởi tạo, không gọi mạng trong test
aws.access-key-id=test
aws.secret-access-key=test
aws.region=ap-southeast-1
aws.s3.bucket=test-bucket
aws.s3.endpoint=
aws.s3.public-endpoint=

# Messaging tắt mặc định; test messaging bật lại và trỏ tới Testcontainers RabbitMQ
app.messaging.enabled=false

# Giữ cấu hình retry giống production cho test DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=100ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=1000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Logging for tests
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.testcontainers=WARN