server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # File trong /static/ có hash trong tên nên cache dài hạn an toàn
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html phải revalidate để nhận bundle mới sau deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
